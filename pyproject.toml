[project]
name = "krisis"
version = "0.1.0"
description = "KRISIS — Knowledge-driven Risk Intelligence & Security Investigation System (CLI-first investigation engine)"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
collectors = [
    "dnspython>=2.4",
    "python-whois>=0.9",
    "ipwhois>=1.2",
    "pyOpenSSL>=23.0",
]
# PDF report graph diagram — falls back to a text tree if missing.
graph = [
    "matplotlib>=3.7",
]
dev = [
    "pytest>=8",
    "pypdf>=4",   # PDF-report tests read back generated PDF text to assert on content
]

[project.scripts]
krisis = "krisis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["krisis*"]
